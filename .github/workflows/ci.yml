name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static Clean-Room Leak Scan
        env:
          BLACKLIST_REGEX: ${{ secrets.BLACKLIST_REGEX }}
        run: bash ./scripts/check_blacklist.sh .

      - name: Build Container Image
        run: make build

      - name: Run Integration Test Suite
        run: make test

      - name: Security & Vulnerability Audit
        run: bash ./scripts/audit_image.sh
