name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Static Clean-Room Leak Scan
        run: bash ./scripts/check_blacklist.sh .

      - name: Build Container Image
        run: make build

      - name: Run Integration Test Suite
        run: make test

      - name: Security & Vulnerability Audit
        run: bash ./scripts/audit_image.sh
