[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-agent-dispatcher"
dynamic = ["version"]
description = "SRE-hardened asynchronous task and agent dispatcher with RQ batch consolidation, atomic Redis locking, and two-tier DLQ."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "redis>=5.0.0",
    "rq>=1.15.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.20.0",
]

[tool.hatch.version]
path = "src/async_agent_dispatcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/async_agent_dispatcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
